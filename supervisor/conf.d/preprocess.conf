; 预处理服务进程组配置
; 支持灵活调整 numprocs 来控制进程数量

[program:preprocess-service]
command=python -m preprocess.server --host 127.0.0.1 --port %(ENV_PREPROCESS_PORT)s --workers 2
directory=/workspace
process_name=%(program_name)s_%(process_num)02d
numprocs=1
numprocs_start=0
autostart=true
autorestart=true
startsecs=10
startretries=3
stopwaitsecs=30
redirect_stderr=true
stdout_logfile=/var/log/supervisor/preprocess-%(process_num)02d.log
stdout_logfile_maxbytes=50MB
stdout_logfile_backups=10
environment=
    PREPROCESS_PORT="%(ENV_PREPROCESS_PORT)s",
    PREPROCESS_HOST="127.0.0.1",
    PREPROCESS_DEVICE="cuda:%(ENV_PREPROCESS_DEVICE_ID)s",
    PYTHONUNBUFFERED="1"
user=root
priority=100
