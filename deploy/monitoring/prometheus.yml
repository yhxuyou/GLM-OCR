global:
  scrape_interval: 15s
  evaluation_interval: 15s
  scrape_timeout: 10s

alerting:
  alertmanagers:
    - static_configs:
        - targets: []

rule_files: []

scrape_configs:
  # ── GLM-OCR Pipeline 服务 ──────────────────────────────────────
  - job_name: glmocr-pipeline
    metrics_path: /metrics
    static_configs:
      - targets:
          - glmocr-pipeline:5002
        labels:
          service: glmocr-pipeline
          env: production

  # ── GLM-OCR 后端服务 ──────────────────────────────────────────
  - job_name: glmocr-backend
    metrics_path: /metrics
    static_configs:
      - targets:
          - glmocr-backend:8001
        labels:
          service: glmocr-backend
          env: production

  # ── vLLM 推理服务 ─────────────────────────────────────────────
  - job_name: vllm-server
    metrics_path: /metrics
    static_configs:
      - targets:
          - vllm-server:8000
        labels:
          service: vllm-inference
          env: production

  # ── Redis 监控 ────────────────────────────────────────────────
  - job_name: redis
    static_configs:
      - targets:
          - redis-exporter:9121
        labels:
          service: redis
          env: production

  # ── Docker / Node 监控 ─────────────────────────────────────────
  - job_name: node
    static_configs:
      - targets:
          - node-exporter:9100
        labels:
          service: node
          env: production