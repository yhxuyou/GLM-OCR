# ══════════════════════════════════════════════════════════════════════
# GLM-OCR Production Nginx Configuration
# ══════════════════════════════════════════════════════════════════════
# 功能:
#   1. 反向代理: 后端服务 + Pipeline 服务
#   2. 速率限制: IP 级别 / 总级别
#   3. 连接限制: 单 IP 并发连接数
#   4. 熔断转发: 上游故障自动摘除 + 重试 + 降级
#   5. TLS 终止: HTTPS + HTTP/2
#   6. 灰度发布: 按 Header/Cookie/IP 分流
#   7. 健康检查: 主动探测上游
# ══════════════════════════════════════════════════════════════════════

# ── 全局配置 ──────────────────────────────────────────────────────────
user nginx;
worker_processes auto;
worker_rlimit_nofile 65535;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

# ── 事件模块 ──────────────────────────────────────────────────────────
events {
    multi_accept on;
    use epoll;
    worker_connections 65535;
}

# ── HTTP 模块 ─────────────────────────────────────────────────────────
http {
    # ── 基础配置 ──────────────────────────────────────────────────────
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    charset utf-8;

    # 日志格式
    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for" '
                    'rt=$request_time uct="$upstream_connect_time" '
                    'uht="$upstream_header_time" urt="$upstream_response_time" '
                    'upstream="$upstream_addr"';

    log_format json_analytics escape=json
        '{'
          '"time_local":"$time_local",'
          '"remote_addr":"$remote_addr",'
          '"remote_user":"$remote_user",'
          '"request":"$request",'
          '"status":$status,'
          '"body_bytes_sent":$body_bytes_sent,'
          '"request_time":$request_time,'
          '"upstream_response_time":"$upstream_response_time",'
          '"upstream_addr":"$upstream_addr",'
          '"http_referer":"$http_referer",'
          '"http_user_agent":"$http_user_agent",'
          '"http_x_forwarded_for":"$http_x_forwarded_for",'
          '"upstream_status":"$upstream_status"'
        '}';

    access_log /var/log/nginx/access.log json_analytics buffer=32k flush=5s;

    # ── 性能优化 ──────────────────────────────────────────────────────
    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    server_tokens off;

    # 连接超时
    keepalive_timeout 120s 120s;
    keepalive_requests 10000;
    client_header_timeout 30s;
    client_body_timeout 120s;
    send_timeout 60s;

    # 请求体大小 (GLM-OCR 需要传输大图片)
    client_max_body_size 100m;
    client_body_buffer_size 10m;
    client_header_buffer_size 4k;
    large_client_header_buffers 4 8k;

    # 代理缓冲区
    proxy_buffering on;
    proxy_buffer_size 8k;
    proxy_buffers 8 64k;
    proxy_busy_buffers_size 128k;
    proxy_request_buffering on;
    proxy_http_version 1.1;

    # 上游连接池
    upstream_keepalive 256;
    proxy_set_header Connection "";

    # ── 速率限制区域定义 ═══════════════════════════════════════════════
    #
    # 语法: limit_req_zone $key zone=name:size rate=rate;
    #
    # 三个级别的限流:
    #   1. 全局:      限制所有请求的总速率
    #   2. 每 IP:     限制单个 IP 的请求速率
    #   3. 每 API Key:限制单个 API 用户的请求速率

    # 级别 1: 全局速率限制 (所有请求总和)
    limit_req_zone $server_name zone=global:10m rate=500r/s;

    # 级别 2: 每 IP 速率限制
    limit_req_zone $binary_remote_addr zone=per_ip:10m rate=20r/s;

    # 级别 2 (备用): 每 IP 突发限制
    limit_req_zone $binary_remote_addr zone=per_ip_burst:10m rate=60r/s;

    # 级别 3: 每 API Key 限制 (如果是认证用户)
    limit_req_zone $http_authorization zone=per_apikey:10m rate=100r/s;

    # 连接数限制: 单 IP 最大并发连接
    limit_conn_zone $binary_remote_addr zone=conn_per_ip:10m;

    # ── 上游服务定义 ═══════════════════════════════════════════════════
    #
    # GLM-OCR Pipeline 服务集群
    # 生产环境应为多个副本，这里配置负载均衡 + 熔断

    upstream glmocr-pipeline {
        # 负载均衡策略: 最少连接 (适合推理服务)
        least_conn;

        # 服务节点 (K8s 中通过 Service 自动发现)
        server glmocr-pipeline:5002 max_fails=3 fail_timeout=30s weight=10;

        # 备用节点 (仅在其他节点都失败时使用)
        server glmocr-pipeline-backup:5002 backup;

        # 健康检查 (商业版 nginx plus 支持主动检查)
        # 开源版通过 max_fails + fail_timeout 实现被动检查
        keepalive 64;
    }

    # GLM-OCR 后端服务
    upstream glmocr-backend {
        least_conn;
        server glmocr-backend:8001 max_fails=3 fail_timeout=30s;
        keepalive 64;
    }

    # vLLM 推理服务 (直接路由, 用于调试)
    upstream vllm-server {
        least_conn;
        server vllm-server:8000 max_fails=3 fail_timeout=60s;
        keepalive 64;
    }

    # ── 灰度发布上游 ═══════════════════════════════════════════════════
    # 新版本 canary 集群
    upstream glmocr-pipeline-canary {
        least_conn;
        server glmocr-pipeline-canary:5002 max_fails=3 fail_timeout=30s;
        keepalive 16;
    }

    upstream glmocr-backend-canary {
        least_conn;
        server glmocr-backend-canary:8001 max_fails=3 fail_timeout=30s;
        keepalive 16;
    }

    # ══════════════════════════════════════════════════════════════════
    # 主服务配置
    # ══════════════════════════════════════════════════════════════════

    server {
        listen 80 default_server;
        listen [::]:80 default_server;
        server_name _;

        # 将所有 HTTP 重定向到 HTTPS
        location / {
            return 301 https://$host$request_uri;
        }

        # Let's Encrypt 验证
        location /.well-known/acme-challenge/ {
            root /var/www/acme;
        }
    }

    server {
        # ═══════════════════════════════════════════════════════════════
        # HTTPS 配置
        # ═══════════════════════════════════════════════════════════════
        listen 443 ssl http2;
        listen [::]:443 ssl http2;
        server_name glmocr.example.com;

        # ── TLS 证书 ──────────────────────────────────────────────────
        ssl_certificate     /etc/nginx/ssl/fullchain.pem;
        ssl_certificate_key /etc/nginx/ssl/privkey.pem;

        # ── TLS 安全配置 ──────────────────────────────────────────────
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305:DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384;
        ssl_prefer_server_ciphers off;
        ssl_session_cache shared:SSL:50m;
        ssl_session_timeout 1d;
        ssl_session_tickets off;

        # HSTS (建议生产环境开启)
        add_header Strict-Transport-Security "max-age=63072000" always;

        # ── 安全头 ────────────────────────────────────────────────────
        add_header X-Frame-Options SAMEORIGIN always;
        add_header X-Content-Type-Options nosniff always;
        add_header X-XSS-Protection "1; mode=block" always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;

        # ── 速率限制 ──────────────────────────────────────────────────

        # 限制总速率
        limit_req zone=global burst=1000 nodelay delay=200;

        # 限制日志 (减少日志量)
        limit_req_log_level notice;

        # 返回 429 时的状态码
        limit_req_status 429;

        # ── 连接限制 ──────────────────────────────────────────────────
        limit_conn conn_per_ip 10;
        limit_conn_log_level notice;
        limit_conn_status 429;

        # ── 通用代理头 ──────────────────────────────────────────────
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Request-ID $request_id;

        # ── 请求 ID (用于全链路追踪) ──────────────────────────────────
        map $http_x_request_id $request_id {
            default $request_id;
            "~." $http_x_request_id;
        }

        # ── 灰度发布路由规则 ─────────────────────────────────────────
        # 根据 Cookie / Header / IP 决定是否走灰度集群
        map $cookie_canary $upstream_group {
            default "stable";
            "canary" "canary";
        }

        map $http_x_canary $upstream_group_header {
            default $upstream_group;
            "true" "canary";
            "1"    "canary";
        }

        # 内部 IP 段自动走灰度 (用于内部测试)
        geo $upstream_canary_ip {
            default 0;
            10.0.0.0/8 1;
            172.16.0.0/12 1;
            192.168.0.0/16 1;
        }

        # ══════════════════════════════════════════════════════════════
        # 路由: 后端 API
        # ══════════════════════════════════════════════════════════════
        location /api/ {
            # 级别 1: 全局整型限流
            limit_req zone=global burst=500 nodelay;

            # 级别 2: 每 IP 限流
            limit_req zone=per_ip burst=10 nodelay;

            # 如果请求体过大, 直接拒绝
            if ($content_length ~* [0-9]+) {
                set $max_body_size 104857600;
                if ($content_length > $max_body_size) {
                    return 413;
                }
            }

            # 超时配置 (后端 API 通常较快)
            proxy_connect_timeout 30s;
            proxy_read_timeout 120s;
            proxy_send_timeout 120s;

            # 熔断转发配置
            proxy_next_upstream error timeout invalid_header http_500 http_502 http_503;
            proxy_next_upstream_timeout 10s;
            proxy_next_upstream_tries 3;
            proxy_intercept_errors on;

            # 灰度分流: 根据 header/cookie/IP 选择上游
            if ($upstream_canary_ip = 1) {
                set $upstream_group_header "canary";
            }

            if ($upstream_group_header = "canary") {
                proxy_pass http://glmocr-backend-canary;
                break;
            }

            proxy_pass http://glmocr-backend;
        }

        # ══════════════════════════════════════════════════════════════
        # 路由: GLM-OCR Pipeline (核心推理服务)
        # ══════════════════════════════════════════════════════════════
        location /glmocr/ {
            # 严格的速率限制 (推理服务最昂贵)
            limit_req zone=per_ip burst=5 nodelay;
            limit_req zone=per_apikey burst=20 nodelay;

            # 超时配置 (Pipeline 可能处理较长时间)
            proxy_connect_timeout 30s;
            proxy_read_timeout 300s;
            proxy_send_timeout 300s;

            # 熔断: 遇到 5xx 尝试下一个 upstream
            proxy_next_upstream error timeout invalid_header http_500 http_502 http_503;
            proxy_next_upstream_timeout 30s;
            proxy_next_upstream_tries 3;

            # 请求 ID 传递 (全链路追踪)
            add_header X-Request-ID $request_id;

            # 灰度
            if ($upstream_canary_ip = 1) {
                proxy_pass http://glmocr-pipeline-canary;
                break;
            }

            proxy_pass http://glmocr-pipeline;
        }

        # ══════════════════════════════════════════════════════════════
        # 路由: vLLM 直接访问 (仅内部网络)
        # ══════════════════════════════════════════════════════════════
        location /vllm/ {
            # 仅在内部网络开放
            allow 10.0.0.0/8;
            allow 172.16.0.0/12;
            allow 192.168.0.0/16;
            deny all;

            # 重写路径: 去掉 /vllm 前缀
            rewrite ^/vllm/(.*) /$1 break;

            proxy_pass http://vllm-server;
        }

        # ══════════════════════════════════════════════════════════════
        # 路由: 健康检查 (无限制)
        # ══════════════════════════════════════════════════════════════
        location /health {
            access_log off;
            limit_req zone=per_ip burst=20 nodelay;

            proxy_pass http://glmocr-backend;
        }

        location /health/pipeline {
            access_log off;
            limit_req zone=per_ip burst=10 nodelay;
            proxy_pass http://glmocr-pipeline/health;
        }

        # ══════════════════════════════════════════════════════════════
        # 路由: 指标 (仅内部)
        # ══════════════════════════════════════════════════════════════
        location /metrics {
            access_log off;
            allow 10.0.0.0/8;
            allow 172.16.0.0/12;
            deny all;
            proxy_pass http://glmocr-pipeline/metrics;
        }

        # ══════════════════════════════════════════════════════════════
        # 路由: API 文档
        # ══════════════════════════════════════════════════════════════
        location /docs {
            limit_req zone=per_ip burst=5 nodelay;
            proxy_pass http://glmocr-backend;
        }

        location /redoc {
            limit_req zone=per_ip burst=5 nodelay;
            proxy_pass http://glmocr-backend;
        }

        # ══════════════════════════════════════════════════════════════
        # 路由: 静态文件 (前端)
        # ══════════════════════════════════════════════════════════════
        location / {
            # 如果有前端静态文件
            root /usr/share/nginx/html;
            index index.html;
            try_files $uri $uri/ /index.html;
        }

        # ══════════════════════════════════════════════════════════════
        # 错误处理
        # ══════════════════════════════════════════════════════════════

        # 429 Too Many Requests (限流降级响应)
        error_page 429 @rate_limited;
        location @rate_limited {
            default_type application/json;
            return 429 '{"error":"rate_limited","message":"请求过于频繁，请稍后重试","retry_after":1}';
        }

        # 502/503/504 上游故障 (熔断降级响应)
        error_page 502 503 504 @upstream_failed;
        location @upstream_failed {
            default_type application/json;
            return 503 '{"error":"service_unavailable","message":"OCR 服务暂时不可用，请稍后重试"}';
        }

        # 413 Request Entity Too Large
        error_page 413 @body_too_large;
        location @body_too_large {
            default_type application/json;
            return 413 '{"error":"payload_too_large","message":"请求体过大，图片大小不能超过 100MB"}';
        }

        # 其他错误
        error_page 500 501 504 /50x.html;
        location = /50x.html {
            root /usr/share/nginx/html;
        }
    }
}