; GLM OCR 异步服务进程组配置
; 支持灵活调整 numprocs 来控制进程数量

[program:glmocr-async-service]
command=bash -c 'exec python -m glmocr.async_server --host 127.0.0.1 --port $(($GLMOCR_PORT + %(process_num)d))'
directory=/workspace
process_name=%(program_name)s_%(process_num)02d
numprocs=4
numprocs_start=0
autostart=true
autorestart=true
startsecs=15
startretries=3
stopwaitsecs=60
redirect_stderr=true
stdout_logfile=/var/log/supervisor/glmocr-async-%(process_num)02d.log
stdout_logfile_maxbytes=100MB
stdout_logfile_backups=20
environment=
    GLMOCR_PORT="%(ENV_GLMOCR_PORT)s",
    GLMOCR_HOST="127.0.0.1",
    PYTHONUNBUFFERED="1",
    REDIS_URL="%(ENV_REDIS_URL)s"
user=root
priority=200
