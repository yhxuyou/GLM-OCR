; 后处理服务进程组配置
; 支持灵活调整 numprocs 来控制进程数量

[program:postprocess-service]
command=bash -c 'exec python -m postprocess.server --host 127.0.0.1 --port $(($POSTPROCESS_PORT + %(process_num)d))'
directory=/workspace
process_name=%(program_name)s_%(process_num)02d
numprocs=2
numprocs_start=0
autostart=true
autorestart=true
startsecs=10
startretries=3
stopwaitsecs=30
redirect_stderr=true
stdout_logfile=/var/log/supervisor/postprocess-%(process_num)02d.log
stdout_logfile_maxbytes=50MB
stdout_logfile_backups=10
environment=
    POSTPROCESS_PORT="%(ENV_POSTPROCESS_PORT)s",
    POSTPROCESS_HOST="127.0.0.1",
    PYTHONUNBUFFERED="1"
user=root
priority=300
