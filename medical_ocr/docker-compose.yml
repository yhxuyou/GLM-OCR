version: '3.8'

services:
  redis:
    image: redis:7-alpine
    container_name: medical-ocr-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 30s
      timeout: 10s
      retries: 3
    restart: unless-stopped

  medical-ocr:
    build: .
    container_name: medical-ocr-server
    ports:
      - "8080:8080"
      - "8001:8001"
    environment:
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - REDIS_DB=0
      - THREAD_POOL_SIZE=8
      - PROMETHEUS_PORT=8001
    depends_on:
      redis:
        condition: service_healthy
    volumes:
      - ./medical_ocr:/app/medical_ocr
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    restart: unless-stopped

volumes:
  redis_data:
