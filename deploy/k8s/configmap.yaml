apiVersion: v1
kind: ConfigMap
metadata:
  name: glmocr-config
  namespace: glm-ocr
data:
  config.yaml: |
    server:
      host: "0.0.0.0"
      port: 5002
    logging:
      level: INFO
    pipeline:
      maas:
        enabled: false
      ocr_api:
        api_host: "vllm-server.glm-ocr.svc.cluster.local"
        api_port: 8000
        model: "glm-ocr"
        api_mode: "openai"
        connect_timeout: 30
        request_timeout: 120
        retry_max_attempts: 3
        retry_backoff_base_seconds: 0.5
        retry_backoff_max_seconds: 8.0
        connection_pool_size: 128
      max_workers: 32
      page_maxsize: 200
      region_maxsize: 2000
      page_loader:
        max_tokens: 8192
        temperature: 0.0
        image_format: JPEG
        min_pixels: 12544
        max_pixels: 71372800
      result_formatter:
        output_format: both
      layout:
        model_dir: "PaddlePaddle/PP-DocLayoutV3_safetensors"
        batch_size: 1
        threshold: 0.3