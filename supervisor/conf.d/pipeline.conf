; Pipeline 服务进程组配置
; 整合预处理、GLM-OCR、后处理三个微服务

[program:pipeline-service]
command=python -m pipeline.server --host 127.0.0.1 --port %(ENV_PIPELINE_PORT)s --workers 2
directory=/workspace
process_name=%(program_name)s_%(process_num)02d
numprocs=1
numprocs_start=0
autostart=true
autorestart=true
startsecs=10
startretries=3
stopwaitsecs=30
redirect_stderr=true
stdout_logfile=/var/log/supervisor/pipeline-%(process_num)02d.log
stdout_logfile_maxbytes=50MB
stdout_logfile_backups=10
environment=
    PIPELINE_PORT="%(ENV_PIPELINE_PORT)s",
    PIPELINE_HOST="127.0.0.1",
    PREPROCESS_HOST="%(ENV_PREPROCESS_HOST)s",
    PREPROCESS_PORT="%(ENV_PREPROCESS_PORT)s",
    GLMOCR_HOST="%(ENV_GLMOCR_HOST)s",
    GLMOCR_PORT="%(ENV_GLMOCR_PORT)s",
    POSTPROCESS_HOST="%(ENV_POSTPROCESS_HOST)s",
    POSTPROCESS_PORT="%(ENV_POSTPROCESS_PORT)s",
    PYTHONUNBUFFERED="1"
user=root
priority=400